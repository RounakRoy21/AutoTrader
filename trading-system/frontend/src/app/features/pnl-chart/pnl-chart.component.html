<mat-card class="chart-card">
  <mat-card-header>
    <mat-card-title>Daily P&L</mat-card-title>
    <div class="period-toggle">
      <mat-button-toggle-group [value]="selectedDays" (change)="onPeriodChange($event.value)">
        <mat-button-toggle *ngFor="let p of periodOptions" [value]="p.value">
          {{ p.label }}
        </mat-button-toggle>
      </mat-button-toggle-group>
    </div>
  </mat-card-header>
  <mat-progress-bar *ngIf="loading" mode="query"></mat-progress-bar>
  <mat-card-content>
    <canvas baseChart
      [datasets]="chartData.datasets"
      [labels]="chartData.labels"
      [options]="chartOptions"
      [type]="chartType">
    </canvas>
  </mat-card-content>
</mat-card>
