<mat-card class="chart-card">
  <mat-card-header>
    <mat-card-title>Daily P&L (Last 30 Days)</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <canvas baseChart
      [datasets]="chartData.datasets"
      [labels]="chartData.labels"
      [options]="chartOptions"
      [type]="chartType">
    </canvas>
  </mat-card-content>
</mat-card>
